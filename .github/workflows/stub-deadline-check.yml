name: Stub deadline check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check-stub-deadline:
    name: Check redirect stub deadline
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS_LINUX || '["ubuntu-latest"]') }}
    timeout-minutes: 5
    steps:
      - name: Runner provenance
        shell: bash
        run: |
          if [[ "${RUNNER_NAME}" == "GitHub Actions"* ]]; then
            echo "::warning::⚠️ FALLBACK — running on GitHub-hosted runner (self-hosted pool unavailable)"
          else
            echo "✅ self-hosted: ${RUNNER_NAME}"
          fi
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      # no-retry: pure local script execution (Check-StubDeadline.ps1 reads
      # AzureAnalyzer.psd1 + tests/redirect-stubs/StubDeadlines.json from the
      # checked-out tree). No external network I/O, nothing to retry.
      - name: Validate stub deadline registry against module version
        shell: pwsh
        run: |
          pwsh -File scripts/Check-StubDeadline.ps1 -Mode Check
