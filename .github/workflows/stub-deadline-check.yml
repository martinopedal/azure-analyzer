name: Stub deadline check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check-stub-deadline:
    name: Check redirect stub deadline
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || fromJSON('["self-hosted","public-linux"]') }}
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      # no-retry: pure local script execution (Check-StubDeadline.ps1 reads
      # AzureAnalyzer.psd1 + tests/redirect-stubs/StubDeadlines.json from the
      # checked-out tree). No external network I/O, nothing to retry.
      - name: Validate stub deadline registry against module version
        shell: pwsh
        run: |
          pwsh -File scripts/Check-StubDeadline.ps1 -Mode Check
